# Automated tests (profile "test"). Throwaway values; MySQL comes from Testcontainers.
spring:
  docker:
    compose:
      enabled: false

logging:
  file:
    path: build/test-logs

eloka:
  environment: test
  cors-allowed-origin-patterns:
    - http://localhost:[*]
  crypto:
    field-key: dGVzdC1maWVsZC1rZXktLS0tLS0tLS0tLS0tLS0tLS0=
    index-key: dGVzdC1pbmRleC1rZXktLS0tLS0tLS0tLS0tLS0tLS0=
  identity:
    otp-pepper: test-pepper
    fixed-otp: "123456"
    otp-min-gap: 0s
    otp-max-per-hour: 1000
    otp-max-per-day: 1000
    otp-max-per-ip-per-hour: 1000
  tenant:
    root-domain: eloka.test
    org-meta-secret: test-org-meta-secret
    org-token-key: dGVzdC1vcmctdG9rZW4ta2V5LS0tLS0tLS0tLS0tLS0=
  notification:
    sms-provider: log
