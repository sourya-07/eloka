# Staging and production. Every value is injected by the deployment; nothing secret is stored here.
# Missing variables stop the app at startup. ELOKA_ENVIRONMENT defaults to production, which turns on
# ProductionSafetyGuard (no fixed OTP, no dev keys, no log-only SMS); staging sets ELOKA_ENVIRONMENT=staging.
spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${ELOKA_DB_URL}
    username: ${ELOKA_DB_USERNAME}
    password: ${ELOKA_DB_PASSWORD}
  flyway:
    enabled: ${ELOKA_DB_MIGRATE_ON_START:false}

server:
  tomcat:
    remoteip:
      internal-proxies: ${ELOKA_TRUSTED_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|127\.0\.0\.1}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}

logging:
  structured:
    format:
      console: ecs
      file: ecs
    json:
      customizer: in.eko.eloka.shared.logging.MaskingJsonCustomizer

eloka:
  environment: ${ELOKA_ENVIRONMENT:production}
  cors-allowed-origin-patterns: ${ELOKA_CORS_ALLOWED_ORIGIN_PATTERNS}
  crypto:
    field-key: ${ELOKA_CRYPTO_FIELD_KEY}
    index-key: ${ELOKA_CRYPTO_INDEX_KEY}
  identity:
    otp-pepper: ${ELOKA_OTP_PEPPER}
    otp-min-gap: 30s
    otp-max-per-hour: 5
    otp-max-per-day: 10
    otp-max-per-ip-per-hour: 10
    session-idle-timeout: ${ELOKA_SESSION_IDLE_TIMEOUT:2h}
    session-absolute-ttl: ${ELOKA_SESSION_ABSOLUTE_TTL:12h}
  tenant:
    root-domain: ${ELOKA_PLATFORM_ROOT_DOMAIN}
    org-meta-secret: ${ELOKA_ORG_META_SECRET}
    org-token-key: ${ELOKA_ORG_TOKEN_KEY}
  notification:
    sms-provider: ${ELOKA_SMS_PROVIDER:log}
    sms-reveal-secrets: ${ELOKA_SMS_REVEAL_SECRETS:false}
