# Settings shared by every environment. Environment-specific values live in
# application-<profile>.yaml. Secrets come only from environment variables.
spring:
  application:
    name: eloka-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # the schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native # trust X-Forwarded-* only from proxies in server.tomcat.remoteip

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

logging:
  file:
    path: ${ELOKA_LOG_DIR:logs}

eloka:
  environment: ${ELOKA_ENVIRONMENT:local}
  identity:
    otp-length: 6
    otp-ttl: 5m
    otp-max-attempts: 5
    session-idle-timeout: 2h
    session-absolute-ttl: 12h
    access-token-ttl: 30m
  # Eko staff sign-in (P8). Google in every environment; OTP only where enabled (local/test).
  staff:
    otp-login-enabled: false
  tenant:
    org-token-ttl: 30d
  # Local Admin onboarding step policy. Open business questions (docs/onboarding/OPEN_QUESTIONS.md)
  # are working assumptions here: change them in config, not in code.
  onboarding:
    idle-expiry: 30d             # OQ-B9
    max-attempts: 3
    live-photo-required: true    # OQ-P4
    bank-account-required: true  # OQ-P6
    pan-holder-types:            # OQ-B5: 4th PAN character per entity type
      PRIVATE_LIMITED: [C]
      LLP: [F]
      PARTNERSHIP: [F]
      SOLE_PROPRIETORSHIP: [P]
    required-documents:          # OQ-P5: no business answer yet
      PRIVATE_LIMITED: [ADDRESS_PROOF, INCORPORATION_CERTIFICATE]
      LLP: [ADDRESS_PROOF, INCORPORATION_CERTIFICATE]
      PARTNERSHIP: [ADDRESS_PROOF, PARTNERSHIP_DEED]
      SOLE_PROPRIETORSHIP: [ADDRESS_PROOF]
    consent-version: "2026-10-01"
    terms-version: "2026-10-01"
    declaration-version: "2026-10-01"
