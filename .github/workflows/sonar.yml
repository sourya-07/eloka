# SonarQube Scan Workflow: .github/workflows/sonar.yml
# This GitHub Actions workflow performs a SonarQube scan on the codebase
# It is triggered on pushes to the 'dev' branch.

name: SonarQube Scan

on:
    push:
        branches:
            - dev

jobs:
    sonarqube:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: client/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run tests with coverage
              run: npm test -- --coverage
              continue-on-error: true

            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v8.4
              env:
                  SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
                  SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}
              with:
                  projectBaseDir: client
                  args: >
                      -Dsonar.projectKey=${{ secrets.SONARQUBE_PROJECT_KEY }}
                      -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
                      -Dsonar.projectName=Your-JS-Project
                      -Dsonar.sources=src
                      -Dsonar.exclusions=node_modules/**,dist/**,__tests__/**,public/**,docs/**,
                      -Dsonar.sourceEncoding=UTF-8
