# Server stack for staging/production: MySQL + one-shot migration + API server.
#   cp .env.example .env   # then fill in real values (never commit .env)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# The client (Next.js) and the TLS edge are added in P6 (see docs/deploy/RUNBOOK.md).
name: eloka

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eloka
      MYSQL_USER: ${ELOKA_DB_USERNAME}
      MYSQL_PASSWORD: ${ELOKA_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--binlog-expire-logs-seconds=604800"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    # No published port: only the server talks to MySQL.

  migrate:
    # Same image, runs Flyway once and exits. The API server itself never changes the schema.
    image: eloka-server:${ELOKA_VERSION:-latest}
    build: ../server
    env_file: .env
    environment:
      ELOKA_DB_URL: jdbc:mysql://mysql:3306/eloka
      ELOKA_DB_MIGRATE_ON_START: "true"
      SPRING_PROFILES_ACTIVE: prod,migrate
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  server:
    image: eloka-server:${ELOKA_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      ELOKA_DB_URL: jdbc:mysql://mysql:3306/eloka
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${ELOKA_SERVER_PORT:-8080}:8080" # put the TLS edge in front of this in production
    volumes:
      - server-logs:/app/logs
      - server-files:/app/data

volumes:
  mysql-data:
  server-logs:
  server-files:
